<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S.</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #020b1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .anel {
      width: 220px;
      height: 220px;
      border: 3px solid #35c8ff;
      border-radius: 50%;
      box-shadow: 0 0 25px #35c8ff;
      animation: pulsar 3s ease-in-out infinite;
    }
    @keyframes pulsar {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="anel"></div>
</body>
</html>
